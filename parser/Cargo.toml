[package]
name = "tree-sitter-sol3"
description = "The sol3 Programming Language"
version = "0.0.1"
authors = ["Martin Feineis"]
license = "UPL-1.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "sol3"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-sol3"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"
